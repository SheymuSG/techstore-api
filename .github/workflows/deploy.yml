name: Deploy to Amazon ECS Fargate

on:
  push:
    # El pipeline se ejecutará de forma automática al hacer push a estas ramas
    branches: [ "main", "develop" ]

env:
  AWS_REGION: us-east-1                       # Región de AWS Academy Learner Lab
  ECR_REPOSITORY: techstore-api               # Nombre de tu repositorio privado en ECR
  ECS_SERVICE: techstore-api-service          # Nombre del servicio que crearás en ECS
  ECS_CLUSTER: techstore-cluster              # Nombre de tu Clúster ECS Fargate
  ECS_TASK_DEFINITION: .aws/task-definition.json # Ruta de la Task Definition (la crearemos más adelante)
  CONTAINER_NAME: techstore-api               # Nombre del contenedor dentro de la Task Definition

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código fuente desde el repositorio de GitHub
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Configurar el entorno de Java 17 para compilar la solución
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Compilar el proyecto con Maven ejecutando pruebas unitarias
    - name: Build with Maven
      run: mvn clean package

    # 4. Configurar las credenciales temporales de AWS usando GitHub Secrets
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Requerido obligatoriamente por AWS Academy
        aws-region: ${{ env.AWS_REGION }}

    # 5. Iniciar sesión de forma segura en Amazon ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # 6. Construir la imagen Docker multi-stage y subirla a ECR
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        # Construcción usando el Dockerfile optimizado y asignándole la URL de ECR
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # 7. Modificar la definición de la tarea de ECS incorporándole la nueva imagen compilada
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    # 8. Desplegar la nueva versión de la Task Definition actualizando el servicio ECS Fargate
    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true